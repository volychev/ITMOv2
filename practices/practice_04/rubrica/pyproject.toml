[project]
name = "rubrica"
version = "0.2.0"
description = "Аудитор папки сдачи практики по рубрике из YAML"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
rubrica = "rubrica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubrica"]